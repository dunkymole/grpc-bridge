services:
  tcp-echo:
    build:
      context: ../..
      dockerfile: test/autobahn/Dockerfile.echo
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9010), timeout=1).close()"]
      interval: 2s
      timeout: 2s
      retries: 15
  bridge:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      LISTEN: 0.0.0.0:8080
      DEFAULT_TARGET: echo
      TARGETS_FILE: /config/targets.json
      TUNNEL_TOKEN: gates-test-token
      ALLOWED_ORIGIN: http://localhost:18081
    volumes:
      - ./targets.json:/config/targets.json:ro
    depends_on:
      tcp-echo:
        condition: service_healthy
  autobahn:
    image: crossbario/autobahn-testsuite:25.10.1@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074
    command: ["wstest", "--mode", "fuzzingclient", "--spec", "/reports/${AUTOBAHN_RUN_ID:?Set AUTOBAHN_RUN_ID}/fuzzingclient.json"]
    volumes:
      - ../../test-results/autobahn:/reports
    depends_on:
      bridge:
        condition: service_healthy
