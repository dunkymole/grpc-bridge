services:
  bridge:
    build: .
    ports:
      - "${BRIDGE_BIND:-127.0.0.1}:${BRIDGE_PORT:-8080}:8080"
    environment:
      UPSTREAM: backend:50051
      TARGETS_FILE: /config/targets.json
      ALLOWED_ORIGIN: ${BRIDGE_ORIGIN:-http://localhost:8080}
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      GOMEMLIMIT: 48MiB
    volumes:
      - ./config:/config:ro
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 128
  backend:
    networks:
      default:
        aliases: [python-demo]
    build:
      context: .
      dockerfile: backend/Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    pids_limit: 128
